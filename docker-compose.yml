version: '3.8'

services:
  hand_tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hand_distance_app
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      - "/dev/video0:/dev/video0" # Kamerani konteynerga ulash
    privileged: true