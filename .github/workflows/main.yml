name: Security & Container Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  bandit:
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: |
          # main branch'dagi barcha Python fayllarni skan qilish
          bandit -r -ll .

  container-scan:
    name: Build & Scan Container Image
    runs-on: ubuntu-latest
    needs: bandit # Bandit muvaffaqiyatli o'tgach ishga tushadi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true # Image'ni lokal Docker daemon'ga yuklaydi
          tags: my-app:${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # CRITICAL yoki HIGH zaiflik topsa workflow'ni to'xtatadi
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
